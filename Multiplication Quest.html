<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2 Digit by 2 Digit Multiplication Quest</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      color: #818cf8;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      padding: 1.5rem;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .btn-save {
      background-color: #10b981;
      color: white;
    }

    .btn-save:hover {
      background-color: #059669;
    }

    .btn-reset {
      background-color: #ef4444;
      color: white;
    }

    .btn-reset:hover {
      background-color: #dc2626;
    }

    .btn-primary {
      background-color: #6366f1;
      color: white;
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .btn-primary:hover {
      background-color: #4f46e5;
    }

    .btn-secondary {
      background-color: #475569;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
    }

    .level-card {
      background: #334155;
      border: 2px solid #475569;
      border-radius: 8px;
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .level-card:hover:not(.locked) {
      border-color: #818cf8;
      transform: translateY(-2px);
    }

    .level-card.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .level-card.completed {
      border-color: #10b981;
      background: #064e3b;
    }

    .level-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .level-status {
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    .game-container {
      display: none;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .problem-display {
      font-size: 2.75rem;
      font-weight: 700;
      text-align: center;
      margin: 1.5rem 0;
      letter-spacing: 2px;
      color: #f1f5f9;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    input[type="number"] {
      width: 180px;
      padding: 0.75rem;
      font-size: 1.5rem;
      text-align: center;
      border-radius: 8px;
      border: 2px solid #475569;
      background: #0f172a;
      color: white;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #818cf8;
    }

    .feedback {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .feedback.correct {
      background: #065f46;
      color: #a7f3d0;
    }

    .feedback.incorrect {
      background: #991b1b;
      color: #fecaca;
    }

    .progress-bar-container {
      width: 100%;
      background-color: #334155;
      border-radius: 8px;
      height: 12px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #10b981;
      transition: width 0.3s ease;
    }

    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <h1>2 Digit by 2 Digit Multiplication Quest</h1>
  <p class="subtitle" id="subtitle">Select a level to begin your quest!</p>

  <div class="card">
    <div class="toolbar">
      <button class="btn btn-save" onclick="saveProgress()">💾 Save Progress</button>
      <button class="btn btn-reset" onclick="resetProgress()">🔄 Reset Progress</button>
    </div>

    <!-- LEVEL MENU -->
    <div id="menu-view">
      <div class="level-grid" id="level-grid"></div>
    </div>

    <!-- GAMEPLAY AREA -->
    <div id="game-view" class="game-container">
      <div class="game-header">
        <button class="btn btn-secondary" onclick="showMenu()">← Back to Menu</button>
        <span id="level-indicator" style="font-weight: bold; color: #818cf8;">Level 1</span>
      </div>

      <div class="problem-display" id="problem-text">12 × 34</div>

      <div class="input-group">
        <label for="user-answer" style="color: #94a3b8; font-size: 0.9rem;">Type your answer:</label>
        <input type="number" id="user-answer" placeholder="?" autocomplete="off">
        <button class="btn btn-primary" id="submit-btn" onclick="checkAnswer()">Submit Answer</button>
      </div>

      <div id="feedback" class="feedback"></div>

      <div style="margin-top: 1.5rem; text-align: center;">
        <span style="font-size: 0.85rem; color: #94a3b8;">
          Question Progress: <span id="q-count">1</span> / <span id="q-total">5</span>
        </span>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'multiplication_quest_progress_v1';
    
    const levels = [
      { id: 1, name: "Level 1", desc: "Multiples of 10" },
      { id: 2, name: "Level 2", desc: "No Regrouping" },
      { id: 3, name: "Level 3", desc: "Easy Regrouping" },
      { id: 4, name: "Level 4", desc: "Full Regrouping" },
      { id: 5, name: "Level 5", desc: "Master Challenge" }
    ];

    let userProgress = loadProgress();
    let currentLevel = 1;
    let currentQuestion = 0;
    const totalQuestions = 5;
    let currentNum1 = 0;
    let currentNum2 = 0;
    let correctAnswer = 0;

    function loadProgress() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      return { 1: { unlocked: true, completed: false }, 2: { unlocked: false, completed: false }, 3: { unlocked: false, completed: false }, 4: { unlocked: false, completed: false }, 5: { unlocked: false, completed: false } };
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(userProgress));
      alert("Progress saved!");
    }

    function resetProgress() {
      if (confirm("Are you sure you want to reset all your progress?")) {
        localStorage.removeItem(STORAGE_KEY);
        userProgress = { 1: { unlocked: true, completed: false }, 2: { unlocked: false, completed: false }, 3: { unlocked: false, completed: false }, 4: { unlocked: false, completed: false }, 5: { unlocked: false, completed: false } };
        showMenu();
      }
    }

    function renderLevels() {
      const grid = document.getElementById('level-grid');
      grid.innerHTML = '';

      levels.forEach(lvl => {
        const prog = userProgress[lvl.id] || { unlocked: false, completed: false };
        const card = document.createElement('div');
        
        let statusClass = '';
        let statusText = 'Locked';
        
        if (prog.completed) {
          statusClass = 'completed';
          statusText = 'Completed ⭐';
        } else if (prog.unlocked) {
          statusClass = 'unlocked';
          statusText = 'Unlocked';
        } else {
          statusClass = 'locked';
        }

        card.className = `level-card ${statusClass}`;
        card.innerHTML = `
          <div class="level-title">${lvl.name}</div>
          <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:0.5rem;">${lvl.desc}</div>
          <div class="level-status">${statusText}</div>
        `;

        if (prog.unlocked) {
          card.onclick = () => startLevel(lvl.id);
        }

        grid.appendChild(card);
      });
    }

    function showMenu() {
      document.getElementById('menu-view').style.display = 'block';
      document.getElementById('game-view').style.display = 'none';
      document.getElementById('subtitle').style.display = 'block';
      renderLevels();
    }

    function startLevel(lvlId) {
      currentLevel = lvlId;
      currentQuestion = 0;
      document.getElementById('menu-view').style.display = 'none';
      document.getElementById('game-view').style.display = 'block';
      document.getElementById('subtitle').style.display = 'none';
      document.getElementById('level-indicator').textContent = `Level ${currentLevel}`;
      nextQuestion();
    }

    function generateNumbers(level) {
      let n1, n2;
      if (level === 1) {
        n1 = Math.floor(Math.random() * 8 + 1) * 10;
        n2 = Math.floor(Math.random() * 89 + 10);
      } else if (level === 2) {
        n1 = Math.floor(Math.random() * 4 + 1) * 10 + Math.floor(Math.random() * 3 + 1);
        n2 = Math.floor(Math.random() * 3 + 1) * 10 + Math.floor(Math.random() * 3 + 1);
      } else if (level === 3) {
        n1 = Math.floor(Math.random() * 40 + 10);
        n2 = Math.floor(Math.random() * 30 + 10);
      } else {
        n1 = Math.floor(Math.random() * 80 + 10);
        n2 = Math.floor(Math.random() * 80 + 10);
      }
      return [n1, n2];
    }

    function nextQuestion() {
      if (currentQuestion >= totalQuestions) {
        completeLevel();
        return;
      }

      const [n1, n2] = generateNumbers(currentLevel);
      currentNum1 = n1;
      currentNum2 = n2;
      correctAnswer = n1 * n2;

      document.getElementById('problem-text').textContent = `${n1} × ${n2}`;
      document.getElementById('user-answer').value = '';
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('q-count').textContent = currentQuestion + 1;
      document.getElementById('q-total').textContent = totalQuestions;
      
      const pct = (currentQuestion / totalQuestions) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      document.getElementById('user-answer').focus();
    }

    function checkAnswer() {
      const input = document.getElementById('user-answer');
      const ans = parseInt(input.value, 10);
      const feedback = document.getElementById('feedback');

      if (isNaN(ans)) return;

      if (ans === correctAnswer) {
        feedback.className = 'feedback correct';
        feedback.textContent = 'Correct! Great job!';
        feedback.style.display = 'block';
        currentQuestion++;
        setTimeout(nextQuestion, 1000);
      } else {
        feedback.className = 'feedback incorrect';
        feedback.textContent = `Not quite. Try again!`;
        feedback.style.display = 'block';
      }
    }

    function completeLevel() {
      userProgress[currentLevel].completed = true;
      if (currentLevel < 5) {
        if (!userProgress[currentLevel + 1]) {
          userProgress[currentLevel + 1] = { unlocked: true, completed: false };
        } else {
          userProgress[currentLevel + 1].unlocked = true;
        }
      }
      saveProgress();
      triggerConfetti();
      alert(`Level ${currentLevel} Complete! 🎉`);
      showMenu();
    }

    document.getElementById('user-answer').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    // CONFETTI ANIMATION
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let pieces = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
      pieces = [];
      const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b'];
      for (let i = 0; i < 80; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: Math.random() * 3 + 2,
          speedX: Math.random() * 2 - 1,
          rot: Math.random() * 360,
          rotSpeed: Math.random() * 10 - 5
        });
      }
      renderConfetti();
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        p.rot += p.rotSpeed;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
      if (pieces.some(p => p.y < canvas.height)) {
        requestAnimationFrame(renderConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // Initialize Menu on Load
    showMenu();
  </script>
</body>
</html>
